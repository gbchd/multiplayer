<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Player</title>
<style>
  html, body { margin:0; height:100%; background:#000; }
  video { width:100%; height:100%; display:block; }
  #msg { position:absolute; inset:auto 0 40px 0; padding:8px; color:#f87171; font:12px system-ui, sans-serif; text-align:center; pointer-events:none; }
</style>
<video controls muted autoplay playsinline></video>
<div id="msg"></div>
<script src="players.js"></script>
<script>
// One tile: player.html?player=<key>&v=<version>&url=<manifest>
const q = new URLSearchParams(location.search);
const key = q.get('player'), version = q.get('v'), url = q.get('url'), p = PLAYERS[key];
const video = document.querySelector('video'), msg = document.getElementById('msg');
const onError = text => { msg.textContent = `${p?.label ?? key}: ${text}`; };
const loadScript = src => new Promise((ok, fail) => {
  const s = document.createElement('script');
  s.src = src; s.onload = ok; s.onerror = () => fail(new Error(`failed to load ${src}`));
  document.head.append(s);
});

(async () => {
  if (!p) throw new Error('unknown player');
  if (p.npm) await loadScript(`https://cdn.jsdelivr.net/npm/${p.npm}@${version}/${p.file(version)}`);
  window.player = await p.attach({ lib: window[p.global], version, video, url, onError });
  window.playheadDate = () => { try { return p.date?.(window.player, video) ?? null; } catch { return null; } };
})().catch(e => onError(e.message));
</script>
</html>
